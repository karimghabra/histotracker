name: Workflow tests

# Runs the data-layer workflow harness (scripts/workflow-test.mjs) on every
# push and pull request. The harness loads the real migrations into in-memory
# SQLite and asserts the lab-pipeline invariants plus a gate per GitHub issue,
# so a workflow regression fails here instead of shipping in an installer.
#
# No dependency install is needed - the harness uses only Node built-ins
# (node:sqlite requires Node 22+).

on:
  push:
  pull_request:
  # The installer workflow runs this whole file on the commit it is about to
  # release, and publishes nothing unless every job here passes.
  workflow_call:

jobs:
  # A green check should say what it proved. tests/suites.json lists every
  # suite in this repository and whether one of the pull-request workflows
  # runs it; this fails when the tree holds a suite the list does not account
  # for, or the list claims a command no workflow runs, and it puts the suites
  # CI does not run on the pull request itself, so nobody has to remember to
  # say so. tests/stress2 went unrun for months and only one pull request ever
  # mentioned it; that is the hole this closes.
  suites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependency install here either: the checker uses only Node built-ins.
      - name: The checker's own tests
        run: node --test scripts/test-coverage.test.mjs

      - name: Check the suite list, and say what CI does not run
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/test-coverage.mjs --markdown "$GITHUB_STEP_SUMMARY" ${PR:+--pr "$PR"}

  workflow-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the workflow harness
        run: node scripts/workflow-test.mjs

      - name: Verify a pre-0023 database still upgrades cleanly
        run: node scripts/make-legacy-db.mjs && node scripts/legacy-db-upgrade-test.mjs

  # The harness only covers the data layer. Everything that lives above it —
  # read-only gating, drawer state, filters, the request dialog — is Playwright
  # only, and until now Playwright never ran in CI at all. That is a direct cause
  # of fixes shipping "green" while being unusable in the app: see the audit
  # correction at the top of docs/issue_remediation_plan.md.
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Component and unit tests
        run: pnpm exec vitest run

      # The lab-record scenarios on the real src/lib/db.ts (tests/scenarios):
      # the staining-rack model, the Logs export pinned cell by cell, and the
      # open issues, each expected to fail until its fix lands.
      - name: Data-layer scenarios
        run: pnpm test:scenarios

      # E4: a screenshot in tests/e2e is asserted on by nothing on a green run.
      # Captures belong in the screenshot tier (tests/screenshot/); this keeps
      # them out of the lightweight suite.
      - name: Capture guard
        run: node scripts/no-unasserted-captures.mjs

      # G1: every browser suite serves vite.config.playwright.ts, never the
      # production config, so a bundle break (a dropped plugin, a bad import, a
      # test shim leaking into production) is otherwise first seen on release
      # day.
      - name: Production build and bundle check
        run: pnpm exec vite build --outDir dist --emptyOutDir --logLevel warn && node scripts/bundle-check.mjs dist

      # Cache the browser binary — it is ~190 MB and otherwise dominates the run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test
        env:
          CI: "true"

      # Traces/screenshots for anything that failed, so a red CI run is
      # diagnosable without reproducing locally.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # pnpm verify's render layer: the pull request's base and this tree, served
  # side by side in the same run, the same small lab built on both under a
  # frozen clock, eight surfaces read as ARIA structure plus a layout/contrast
  # audit at two widths, no screenshot, no stored baseline. A structural
  # difference is reported, because an update is meant to change something; a
  # new audit line on head that base does not have (a cut-off control,
  # unreadable text) fails. The captain's ruling of 2026-09-14: this job runs
  # against the pull request's base.
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Render diff against the pull request's base
        # On a pull request, the base is the branch it targets. Outside one (a
        # push straight to a branch, or the release workflow calling this file),
        # scripts/verify.mjs falls back to merge-base against origin/master
        # itself, so no --base is passed here at all.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            node scripts/verify.mjs --only render --base "${{ github.event.pull_request.base.sha }}"
          else
            node scripts/verify.mjs --only render
          fi

      - name: Upload the render tier's own logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diff
          path: .verify-out/render/
          retention-days: 7

  # Is this change compatible with the build the lab is running? Runs the REAL
  # data layer of the release in use from its tag, against this checkout's: a
  # database each one wrote, opened and worked on by the other, through
  # upgrade, rollback, backup revert and sync.
  # The in-use release is IN_USE_RELEASE in scripts/compat-releases.mjs.
  # See docs/release_compat.md.
  release-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compatibility with the release in use
        run: pnpm test:compat

  # The Rust shell, and in it `db_migrate_image` (src-tauri/src/migrate.rs):
  # what brings a backup or a pulled snapshot up to this build's migrations on
  # the lab's machine. The e2e and compat suites exercise only its TypeScript
  # model (src/test/sqlx-migrator.ts), so without this job a change to the real
  # command would first be tried in the captain's Backups dialog. Linux, because
  # nothing in migrate.rs or its tests depends on the platform; the installer
  # build compiles for Windows at release time.
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install the Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # tauri::generate_context!() reads `frontendDist` at compile time and
      # fails when it does not exist. The Rust needs the directory, not a real
      # frontend build.
      - name: Stand in for the frontend build
        run: mkdir -p dist && printf '<!doctype html>\n' > dist/index.html

      # --locked: Cargo.lock must already agree with Cargo.toml, which is what
      # catches a version bump made in one and not the other.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked

      # The backup_fs tests are only worth having if they can fail. This plants
      # one defect at a time in src-tauri/src/backup_fs.rs (a copy, built as a
      # crate of its own) and fails when any of them goes uncaught.
      - name: backup tests catch planted defects
        run: bash scripts/backup-mutants.sh

  # pnpm verify's screenshot layer: the 26 captures E4 moved out of tests/e2e,
  # so a person can still look, per the captain's ruling of 2026-09-14 ("its
  # fine to take screenshots, as long as more lightweight e2e tests are
  # performed first"). Runs last, and only once the data, render and e2e
  # layers are all green; never on the lab machine.
  screenshot:
    needs: [suites, workflow-harness, browser-tests, release-compat, render]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Screenshot tier
        run: pnpm test:screenshot

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-tier
          path: test-results/
          retention-days: 7
