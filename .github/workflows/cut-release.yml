name: Cut a release

# Builds the Histometer Windows installer (.exe + .msi) in the cloud on a
# GitHub-hosted Windows runner that already has Rust, the MSVC toolchain and
# Node.js installed, and publishes it as a GitHub Release tagged
# `app-v<version>`:
#
#     https://github.com/karimghabra/histotracker/releases
#
# A release is cut from MASTER and from nowhere else. Until 0.18.0 this workflow
# ran on every push to a `claude/**` branch, and 0.14.3 through 0.17.0 were
# published from branches master never received: for a month the trunk and the
# build the lab ran were two different codebases, and nothing said so
# (docs/release_line_reconciliation.md). So now:
#
#   - It runs only when started by hand ("Run workflow") on master. No push, no
#     branch and no tag can publish a release.
#   - `plan` refuses any other ref, version files out of step, a version that is
#     already released or is not newer than the newest release, a CHANGELOG.md
#     with no `## <version>` section, and any release tag that master does not
#     contain (scripts/release-check.mjs).
#   - `tests` runs the whole test workflow on that exact commit, including the
#     compatibility check against the release in use. 0.15.0 was published from
#     a push whose test run had failed; that cannot happen from here.
#   - `build` tags the release at the commit that was planned and tested, and
#     `verify` checks that the tag really does name it.
#
# WHY THIS FILE IS NOT `build-installer.yml` ANY MORE. GitHub runs a
# push-triggered workflow from the copy of the workflow file that lives in the
# pushed commit, so the guard above binds only commits that descend from it. The
# pre-0.18.0 copy (push to `claude/**`, `v*` tags, `workflow_dispatch`,
# `contents: write`, no plan step and no test gate) still sits at
# `.github/workflows/build-installer.yml` on unmerged branches, and a push of one
# of them at a version that is already released REPLACES that release's
# installers while leaving its tag where it is, and no check can see it: the
# installers on the app-v0.16.1 release page were uploaded at 01:49:10-12Z on
# 2026-08-28 by a second push to `claude/issues-129-133`, twelve minutes after
# the release was published at 01:37:50Z, and the tag still names the first
# commit (docs/releasing.md).
# Renaming this file separates the live release workflow from the one those
# copies address: the old path is now a workflow master does not have, disabled
# in the repository's Actions settings, and this one has no trigger a branch can
# reach. Do not reintroduce the old path.
#
# A release is never rebuilt or overwritten: to ship again, bump the version.
# How to cut one: docs/releasing.md.

on:
  workflow_dispatch: {}

# One release at a time, and never cancel one halfway through publishing it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout source, with every tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: May this commit be released?
        id: plan
        run: node scripts/release-check.mjs plan

  tests:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    # test.yml's `suites` job asks for pull-requests: write so it can post what
    # a pull request's CI did not run. A called workflow may only narrow the
    # caller's token, so the permission is granted here too; there is no pull
    # request on a release run, so nothing is written.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/test.yml

  build:
    needs: [plan, tests]
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      # Needed so the release step can create the GitHub Release and its tag.
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # The Tauri bundler downloads the WiX and NSIS toolchains from GitHub
      # releases on every run and has no retry: a dropped connection kills the
      # build after the Rust compile has already succeeded, with
      # `failed to bundle project: io: Peer disconnected`. That happened twice
      # in a row on 0.11.0 — once on WiX, once on NSIS — turning a green build
      # into a coin flip. Caching the directory the bundler unpacks them into
      # means a run only downloads them if the cache is cold.
      - name: Cache Tauri bundler toolchains (WiX, NSIS)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-v1

      # …and fetch them ourselves if the cache is cold, because the bundler's own
      # download has no retry: one dropped connection and the build dies AFTER
      # the eight-minute Rust compile, with
      # `failed to bundle project: io: Peer disconnected`. That hit 0.11.0 three
      # times running — twice on WiX, once on NSIS — so the download is the least
      # reliable step in the whole pipeline and the only one with no second
      # chance.
      #
      # Best effort by design: if the layout the bundler expects ever changes,
      # this step simply does not satisfy it and the bundler downloads as before.
      # It must never be the reason a build fails, hence continue-on-error.
      - name: Pre-fetch WiX and NSIS (with retries)
        continue-on-error: true
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\tauri"
          function Get-WithRetry($url, $out) {
            for ($i = 1; $i -le 5; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 120
                return $true
              } catch {
                Write-Host "attempt $i failed for $url : $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 5)
              }
            }
            return $false
          }
          $targets = @(
            @{ Url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"; Dir = "$root\WixTools314" },
            @{ Url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"; Dir = "$root\NSIS" }
          )
          foreach ($t in $targets) {
            if (Test-Path $t.Dir) { Write-Host "cached already: $($t.Dir)"; continue }
            $zip = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetFileName($t.Url))
            if (Get-WithRetry $t.Url $zip) {
              # Unpack via a staging dir and FLATTEN a single top-level folder.
              # The two archives disagree: wix314-binaries.zip has its exes at
              # the root, nsis-3.11.zip wraps everything in one directory. The
              # first version of this step extracted both verbatim, so WiX was
              # satisfied and NSIS was not — the bundler downloaded NSIS anyway
              # and the tag build for 0.11.0 died on exactly that.
              $stage = Join-Path $env:RUNNER_TEMP ("stage-" + [System.IO.Path]::GetFileNameWithoutExtension($t.Url))
              if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
              Expand-Archive -Path $zip -DestinationPath $stage -Force
              $entries = Get-ChildItem $stage
              $src = if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) { $entries[0].FullName } else { $stage }
              New-Item -ItemType Directory -Force -Path $t.Dir | Out-Null
              Copy-Item -Path (Join-Path $src '*') -Destination $t.Dir -Recurse -Force
              Write-Host "unpacked to $($t.Dir)"
            } else {
              Write-Host "giving up on $($t.Url) — the bundler will try its own download"
            }
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action runs `pnpm tauri build`, which compiles the Rust shell
      # and bundles the NSIS `.exe` and `.msi` installers, then publishes them
      # to a GitHub Release. `__VERSION__` is replaced with the app version from
      # tauri.conf.json (0.18.0 -> tag `app-v0.18.0`), the same number `plan`
      # checked. The tag is created at this run's commit, the one `plan` and
      # `tests` passed; `plan` has already refused a version that has a tag.
      - name: Build the app and publish a Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Histometer v__VERSION__"
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Windows installer for Histometer.

            Download the `..._x64-setup.exe` asset below (recommended) or the
            `.msi`, run it, and launch Histometer from the Start menu. No
            Node.js, Rust or build tools are required on the target machine.
          releaseDraft: false
          prerelease: false

      # The same installers, attached to the run as well as to the release.
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: histometer-windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # The tag must name the commit this run planned, tested and built. tauri-action
  # uploads into an existing release rather than failing, so a tag created by
  # anyone else between `plan` and `build` would otherwise pass unnoticed.
  verify:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: The release tag names the commit that was tested
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tagged=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error title=Release::$TAG points at $tagged, but this run tested and built $GITHUB_SHA"
            exit 1
          fi
          echo "$TAG is at $GITHUB_SHA"
